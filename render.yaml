services:
  - type: web
    name: onground
    env: python
    region: oregon
    buildCommand: pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: liquid/lfm-2.5-2.6b:free
      - key: FRONTEND_URL
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ENVIRONMENT
        value: production
